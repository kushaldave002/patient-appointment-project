<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appointment desk</title>
<style>
:root { color-scheme: light; --ink: #182f2c; --muted: #526661; --green: #165b4b; --line: #cedad1; }
* { box-sizing: border-box; }
body { margin: 0; background: #f4f6f0; color: var(--ink); font: 1rem/1.55 "DM Sans", system-ui, sans-serif; }
header { border-bottom: 1px solid var(--line); background: #fcfdf9; }
.bar { max-width: 62rem; margin: auto; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; min-height: 4.4rem; }
.brand { display: flex; gap: .7rem; align-items: center; font-weight: 650; font-size: 1.12rem; letter-spacing: -.035em; }
.mark { display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: .5rem; background: var(--green); color: white; font-size: 1.55rem; line-height: 1; }
main { max-width: 48rem; margin: clamp(1.75rem, 6vh, 4rem) auto; padding: 0 1.25rem; }
h1 { font: 500 clamp(2.25rem, 5vw, 3.75rem)/1.08 "Iowan Old Style", Georgia, serif; letter-spacing: -.048em; margin: 0 0 1rem; }
.intro { margin: -.3rem 0 1.7rem; color: var(--muted); }
.panel { border: 1px solid var(--line); background: #fff; border-radius: 1.15rem; overflow: hidden; box-shadow: 0 5px 24px #20372808; }
.transcript { padding: 1.5rem; }
.transcript:empty { display: none; }
.message { margin-bottom: 1.25rem; overflow-wrap: anywhere; }
.message:last-child { margin-bottom: 0; }
.message b, label { display: block; font-size: .84rem; font-weight: 650; color: var(--muted); }
.message p { white-space: pre-wrap; margin: .28rem 0 0; }
.user { margin-left: 12%; padding: .6rem 1rem; background: #eef4ed; border-radius: .8rem; }
.user b { color: #2d604f; }
.actions { padding: 1.5rem; }
.transcript:not(:empty) + .actions { border-top: 1px solid #e3e9e2; }
.choices, .input-row { display: flex; gap: .55rem; }
.choices { flex-wrap: wrap; margin-bottom: 1.35rem; }
button, input { font: inherit; }
button { cursor: pointer; }
.choice, .reset { color: var(--green); border: 1px solid #adc6b7; border-radius: .55rem; background: #f8fbf7; padding: .55rem .9rem; font-size: .92rem; font-weight: 600; min-height: 2.65rem; }
.choice:hover, .reset:hover { background: #e9f2e9; }
.reset { background: transparent; padding-inline: .8rem; }
label { margin-bottom: .4rem; }
input[type=text] { flex: 1; min-width: 0; padding: .7rem .85rem; border: 1px solid #94aaa1; border-radius: .6rem; color: var(--ink); background: #fff; }
.send { border: 0; border-radius: .6rem; background: var(--green); color: #fff; padding: .65rem 1.1rem; font-weight: 600; }
.send:hover { background: #0a483a; }
.send span { padding-left: .18rem; }
:focus-visible { outline: 3px solid #397d98; outline-offset: 3px; }
.note { font-size: .85rem; color: var(--muted); margin: .8rem .1rem; }
@media (max-width: 32rem) { .bar { padding-inline: 1rem; } main { padding-inline: .9rem; } .actions, .transcript { padding: 1rem; } .user { margin-left: 5%; } }
</style>
</head>
<body>
<header><div class="bar"><div class="brand"><span class="mark" aria-hidden="true">+</span>Appointment desk</div>$reset</div></header>
<main>
<h1>$title</h1>
$intro
<div class="panel">
<div class="transcript">$messages</div>
<div class="actions" id="latest">$controls$composer</div>
</div>
<p class="note">Scheduling demo · Use synthetic patient details only.</p>
</main>
</body>
</html>
